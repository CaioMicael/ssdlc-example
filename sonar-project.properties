sonar.projectKey=ssdlc-example
sonar.projectName=ssdlc-example
sonar.sourceEncoding=UTF-8

sonar.sources=backend,frontend/src
sonar.exclusions=frontend/dist/**,**/node_modules/**,**/coverage/**

sonar.test.inclusions=backend/**/*_test.go,frontend/src/**/*.test.tsx

sonar.go.coverage.reportPaths=backend/coverage.out
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
